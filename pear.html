<!doctype html>
<!-- GUI entrypoint for the Pear runtime (pear.gui.main in package.json); index.html is the
     Electron one. Two files rather than one because the bundles they load are not
     interchangeable: Pear resolves ES modules through Bare, Electron requires CommonJS. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linda - P2P Sovereign Messenger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <app-shell></app-shell>
  <script type="module" src="./dist/pear/app.js"></script>
</body>
</html>
