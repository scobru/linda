# Builds the Windows desktop app (.msix) and attaches it to a GitHub release.
#
# Runs in CI instead of on a dev's own Windows machine so a release doesn't depend on someone
# having `npm run make` handy locally — mirrors macos-release.yml's trigger and upload shape.
#
# Self-signed (forge.config.cjs's manifestVariables.publisher, no real code-signing cert), so
# Windows warns ("Windows protected your PC") on a first install. Signed with the one dev cert
# every existing install already trusts (WINDOWS_CERTIFICATE_PFX_BASE64/_PASSWORD secrets) rather
# than a fresh cert per build: MSIX enforces exact publisher-cert continuity to let one version
# update to the next, so a different cert every release doesn't just warn — it disables "Aggiorna"
# outright with "Editore: Sconosciuto", since Windows can't tell it's the same app at all.
name: Windows release build

on:
  # Runs when a release is published rather than when the tag is pushed: the upload target has to
  # exist first, and the tag is pushed before the release is created.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v1.14.14)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Resolve the tag being built
        id: tag
        shell: bash
        run: echo "tag=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Skips the mobile workspace: it pulls the whole React Native toolchain, and none of it goes
      # into the desktop app.
      - run: npm ci --workspaces=false --include-workspace-root

      - run: npm run build

      - name: Decode the signing certificate
        id: cert
        shell: bash
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/windows-signing.pfx"
          echo "$PFX_BASE64" | base64 --decode > "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Package for win32/x64
        env:
          WINDOWS_CERTIFICATE_FILE: ${{ steps.cert.outputs.path }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: npx electron-forge make --platform=win32 --arch=x64

      - name: Remove the decoded certificate
        if: always()
        shell: bash
        run: rm -f "${{ steps.cert.outputs.path }}"

      - name: Name the artifact
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p upload
          src="$(find out/make/msix/x64 -name '*.msix' -print -quit)"
          if [ -z "$src" ]; then
            echo "no msix produced" >&2
            exit 1
          fi
          cp "$src" "upload/linda-pear-$TAG-win-x64.msix"
          ls -la upload

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" upload/*.msix --clobber

# To real-sign instead of shipping a self-signed package Windows SmartScreen warns on first
# install regardless of publisher-cert continuity:
#   1. Get a code-signing certificate (EV recommended — avoids SmartScreen's reputation delay).
#   2. Swap WINDOWS_CERTIFICATE_PFX_BASE64/_PASSWORD above for that certificate's.
