# Runs the test suite, and compiles the mobile app, on every push and pull request.
#
# The repo had no workflow running tests at all, so the suite only ever ran when someone
# remembered to type `npm test` — which is how a complete two-Session integration harness sat in
# test/ unexecuted since the initial commit.
#
# The Session test bootstraps an in-process DHT (hyperdht/testnet), so nothing here needs the
# public network. Set LINDA_TEST_DHT=public to run those assertions against the real DHT instead;
# that is a manual check, not something to gate a push on.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Skips the mobile workspace: it pulls the whole React Native toolchain and the suite is core.
      - run: npm ci --workspaces=false --include-workspace-root

      - run: npm run typecheck

      - run: npm test

  # The mobile app, which the job above skips. Without this, nothing on a pull request compiled the
  # Kotlin or typechecked mobile/: the Android app was first built when a release was published, so
  # a native change reached main untested.
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Same preparation as android-release.yml: the mobile workspace, the native addons linked into
      # react-native-bare-kit, and the worklet bundle that mobile/src/bare/client.ts imports.
      - run: npm ci --include-workspace-root

      - run: node node_modules/react-native-bare-kit/android/link.mjs

      - run: npm run worklet
        working-directory: mobile

      - run: npm run typecheck
        working-directory: mobile

      # Compiles the app's Kotlin (and everything it depends on) without packaging an APK: the
      # errors this is here for are compile errors, and assembling a release is minutes more.
      - name: Compile the Android app's Kotlin
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon -PreactNativeArchitectures=arm64-v8a
