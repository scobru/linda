# From the repo root:  docker compose -f deploy/bootstrap/docker-compose.yml up -d --build
services:
  linda-dht:
    build:
      context: ../..
      dockerfile: deploy/bootstrap/Dockerfile
    restart: unless-stopped
    environment:
      DHT_PORT: ${DHT_PORT:-49737}
    ports:
      - "${DHT_PORT:-49737}:${DHT_PORT:-49737}/udp"
